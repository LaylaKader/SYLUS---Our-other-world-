name: SYLUS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.compose.example .env
          docker compose config --quiet
      - name: Build private backend image
        run: docker build -f backend/Dockerfile -t sylus-backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t sylus-frontend:ci .
      - name: Smoke-test private stack and database migrations
        run: |
          cp .env.compose.example .env
          docker compose up --build -d
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/health
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/messages)
          test "$code" = "401"
          curl -fsS -c /tmp/sylus-cookies.txt \
            -H "Content-Type: application/json" \
            -d '{"password":"replace-with-a-unique-owner-password"}' \
            http://localhost:8080/v1/session
          curl -fsS -b /tmp/sylus-cookies.txt http://localhost:8080/v1/time-context
          curl -fsS -b /tmp/sylus-cookies.txt http://localhost:8080/v1/memories
          docker compose down -v
