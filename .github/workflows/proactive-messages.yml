name: Sylus proactive messages

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check-for-a-message:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SYLUS_BASE_URL: ${{ secrets.SYLUS_BASE_URL }}
      SYLUS_SCHEDULER_SECRET: ${{ secrets.SYLUS_SCHEDULER_SECRET }}
    steps:
      - name: Ask the private companion service to check
        if: ${{ env.SYLUS_BASE_URL != '' && env.SYLUS_SCHEDULER_SECRET != '' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $SYLUS_SCHEDULER_SECRET" \
            "$SYLUS_BASE_URL/internal/proactive/run"
      - name: Explain missing setup without failing scheduled runs
        if: ${{ env.SYLUS_BASE_URL == '' || env.SYLUS_SCHEDULER_SECRET == '' }}
        run: echo "Add SYLUS_BASE_URL and SYLUS_SCHEDULER_SECRET in repository Actions secrets to activate background delivery."
