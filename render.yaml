services:
  - type: web
    name: sylus-companion-private
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SYLUS_OWNER_PASSWORD
        sync: false
      - key: SYLUS_OWNER_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: "1209600"
      - key: MODEL_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        value: openai/gpt-oss-120b
